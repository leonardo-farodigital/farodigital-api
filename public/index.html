<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faro Digital - Cotizador</title>
</head>
<body>
  <h1>Bienvenido al Cotizador de Faro Digital</h1>
  <p>Haz clic en un botón para probar una cotización:</p>

  <button onclick="cotizar('dcp', 20)">Cotizar DCP (20 min)</button>
  <button onclick="cotizar('copia', 45)">Cotizar Copia Canal (45 min)</button>
  <button onclick="cotizar('color', 1)">Cotizar Color (1 jornada)</button>

  <h2>Resultado:</h2>
  <pre id="resultado"></pre>

<script>
  // Utilidad para mostrar resultados
  function show(text) {
    const el = document.getElementById('output') || document.getElementById('result') || document.getElementById('Resultado') || document.querySelector('#resultado, #output, #result') || (function(){
      const d=document.createElement('pre'); d.id='output'; document.body.appendChild(d); return d;
    })();
    el.textContent = text;
  }

  // Llamador genérico: pide el endpoint del backend y muestra el texto
  async function cotizar(path) {
    try {
      const res = await fetch(path, { headers: { 'Accept': 'text/plain,application/json' }});
      const text = await res.text();     // el backend devuelve texto con el detalle
      show(text);
    } catch (e) {
      show('Error: ' + (e?.message || e));
    }
  }

  // Botones de prueba rápida (usa tus rutas que ya comprobamos que funcionan)
  document.getElementById('btnDcp')?.addEventListener('click', () => cotizar('/cotizar/dcp/20'));
  document.getElementById('btnCanal')?.addEventListener('click', () => cotizar('/cotizar/mxf/45'));
  document.getElementById('btnColor')?.addEventListener('click', () => cotizar('/cotizar/color/1'));
</script>
