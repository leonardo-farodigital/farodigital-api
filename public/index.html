<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faro Digital - Cotizador</title>
</head>
<body>
  <h1>Bienvenido al Cotizador de Faro Digital</h1>
  <p>Haz clic en un botón para probar una cotización:</p>

  <button onclick="cotizar('dcp', 20)">Cotizar DCP (20 min)</button>
  <button onclick="cotizar('copia', 45)">Cotizar Copia Canal (45 min)</button>
  <button onclick="cotizar('color', 1)">Cotizar Color (1 jornada)</button>

  <h2>Resultado:</h2>
  <pre id="resultado"></pre>

  <script>
    async function cotizar(tipo, duracion) {
      try {
        const res = await fetch(`/api/quote?tipo=${tipo}&duracion=${duracion}`);
        const data = await res.json();
        document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("resultado").textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
