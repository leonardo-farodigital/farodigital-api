<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faro Digital - Cotizador</title>
</head>
<body>
  <h1>Bienvenido al Cotizador de Faro Digital</h1>
  <p>Haz clic en un botón para probar una cotización:</p>

  <button onclick="cotizar('dcp', 20)">Cotizar DCP (20 min)</button>
  <button onclick="cotizar('copia', 45)">Cotizar Copia Canal (45 min)</button>
  <button onclick="cotizar('color', 1)">Cotizar Color (1 jornada)</button>

  <h2>Resultado:</h2>
  <pre id="resultado"></pre>

<script>
  // Elementos de salida
  const out = document.getElementById('quoteOut') || document.getElementById('resultado') || document.querySelector('#resultado, #quoteOut');

  function setOut(msg) {
    if (!out) return;
    out.textContent = msg;
  }

  async function fetchQuote(url) {
    try {
      setOut('Cargando…');
      const res = await fetch(url, { headers: { 'Accept': 'application/json' }});
      const ct = (res.headers.get('content-type') || '').toLowerCase();

      // Si vino HTML/Texto, mostramos error legible
      if (!ct.includes('application/json')) {
        const txt = await res.text();
        setOut(`Error: la ruta devolvió contenido no-JSON.\nURL: ${url}\n---\n${txt.slice(0, 200)}…`);
        return;
      }

      const data = await res.json();
      // Si tu API entrega { texto: "..." } úsalo, si no armamos algo simple
      const texto = data?.texto ||
        JSON.stringify(data, null, 2);

      setOut(texto);
    } catch (err) {
      setOut(`Error: ${err.message}`);
    }
  }

  // Botones de prueba (ajusta las rutas si tu API usa otros nombres)
  // Confirmado: /cotizar/dcp/20 funciona
  document.getElementById('btnDcp')?.addEventListener('click', () => {
    fetchQuote('/cotizar/dcp/20');
  });

  // Si tu backend usa /cotizar/mxf/45 (o /cotizar/canal/45) cambia aquí:
  document.getElementById('btnCanal')?.addEventListener('click', () => {
    fetchQuote('/cotizar/mxf/45');  // ← cámbialo a la ruta correcta si fuese distinto
  });

  // Para color por jornada: si tu backend expone /cotizar/color/1 (o similar) ajústalo:
  document.getElementById('btnColor')?.addEventListener('click', () => {
    fetchQuote('/cotizar/color/1'); // ← ajusta si es otro slug
  });
</script>
