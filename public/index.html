<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Faro Digital - Cotizador</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 28px; }
    button { margin-right: 8px; }
    pre { background:#f7f7f7; padding:12px; border-radius:6px; }
  </style>
</head>
<body>
  <h1>Bienvenido al Cotizador de Faro Digital</h1>
  <p>Haz clic en un botón para probar una cotización:</p>

  <div>
    <button id="btnDcp">Cotizar DCP (20 min)</button>
    <button id="btnMov">Cotizar Copia Canal (45 min)</button>
    <button id="btnColor">Cotizar Color (1 jornada)</button>
  </div>

  <h3>Resultado:</h3>
  <pre id="out"></pre>

  <script>
    const out = document.getElementById('out');

    async function pedir(url) {
      out.textContent = 'Consultando…';
      try {
        const res = await fetch(url);
        if (!res.ok) {
          out.textContent = `Error: ${res.status} ${res.statusText}`;
          return;
        }
        // Estas rutas devuelven JSON con { texto: "..." } o directamente el objeto de cotización.
        const data = await res.json();
        // Si viene con campo "texto" lo mostramos, si no, mostramos el JSON formateado.
        out.textContent = data.texto ? data.texto : JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = 'Error de red: ' + e.message;
      }
    }

    // RUTAS CORRECTAS DEL BACKEND:
    //  - /cotizar/dcp/:min
    //  - /cotizar/mov/:min    (MXF/XDCAM/MOV – copia canal)
    //  - /cotizar/color/1     (jornada de color)

    document.getElementById('btnDcp').addEventListener('click', () => {
      pedir('/cotizar/dcp/20');
    });

    document.getElementById('btnMov').addEventListener('click', () => {
      pedir('/cotizar/mov/45');
    });

    document.getElementById('btnColor').addEventListener('click', () => {
      pedir('/cotizar/color/1');
    });
  </script>
</body>
</html>
