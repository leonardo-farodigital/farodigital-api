<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Asistente Leonardo — Faro Digital</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 24px; }
  h1 { margin: 0 0 8px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 12px 0; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
  input, select, button, textarea { font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { cursor: pointer; }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  .out { white-space: pre-wrap; background:#fafafa; border:1px dashed #ddd; padding:10px; border-radius:8px; }
  .money { font-weight: 600; }
</style>

<h1>Asistente Leonardo — Faro Digital</h1>
<p>Prueba rápida. Cotiza DCP/MXF más abajo o conversa con el asistente.</p>

<div class="card">
  <h3>🧮 Cotizador rápido</h3>
  <div class="row">
    <div>
      <label>Servicio</label>
      <select id="service">
        <option value="dcp">DCP (copia cine)</option>
        <option value="mxf">MXF / XDCAM / MOV (canal)</option>
      </select>
    </div>

    <div id="variantWrap">
      <label>Tipo DCP</label>
      <select id="variant">
        <option value="create">Creación (primera copia)</option>
        <option value="clone">Clonación (duplicado)</option>
      </select>
    </div>

    <div>
      <label>Duración (min)</label>
      <input id="minutes" type="number" min="1" step="1" value="15" />
    </div>

    <div id="kdmWrap">
      <label>&nbsp;</label>
      <label style="display:flex;gap:8px;align-items:center;">
        <input id="kdm" type="checkbox" /> Incluir KDM
      </label>
    </div>

    <div>
      <button id="btnQuote">Calcular</button>
    </div>
  </div>

  <div id="quoteOut" class="out" style="margin-top:12px;"></div>
</div>

<div class="card">
  <h3>💬 Chat</h3>
  <div id="chatBox" class="out" style="min-height:120px;">(aún sin mensajes)</div>
  <div class="row" style="margin-top:10px;">
    <div style="flex:1">
      <label>Escribe tu mensaje…</label>
      <textarea id="msg"></textarea>
    </div>
    <div>
      <button id="btnSend">Enviar</button>
    </div>
  </div>
</div>

<script>
  const CLP = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });

  // Mostrar/ocultar campos específicos de DCP
  const serviceEl = document.getElementById("service");
  const variantWrap = document.getElementById("variantWrap");
  const kdmWrap = document.getElementById("kdmWrap");
  function refreshVisibility() {
    const isDcp = serviceEl.value === "dcp";
    variantWrap.style.display = isDcp ? "block" : "none";
    kdmWrap.style.display = isDcp ? "block" : "none";
  }
  serviceEl.addEventListener("change", refreshVisibility);
  refreshVisibility();

  // Cotizador
  document.getElementById("btnQuote").addEventListener("click", async () => {
    const service = document.getElementById("service").value;
    const variant = document.getElementById("variant").value;
    const minutes = Number(document.getElementById("minutes").value || 0);
    const kdm = document.getElementById("kdm").checked;

    const payload = { service, minutes, variant, kdm };
    const res = await fetch("/quote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const out = document.getElementById("quoteOut");
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      out.textContent = "Error: " + (err.error || res.status);
      return;
    }
    const data = await res.json();
    const lines = [
      `Servicio: ${data.summary.service.toUpperCase()} ${data.summary.variant ? "(" + data.summary.variant + ")" : ""}`,
      `Duración: ${data.summary.minutes} min`,
      data.breakdown.map(b => `• ${b.item}${b.minutes ? " ("+b.minutes+" min)" : ""}: ${CLP.format(b.amount)}`).join("\n"),
      `TOTAL: ${CLP.format(data.total)}`
    ];
    out.textContent = lines.filter(Boolean).join("\n");
  });

  // Chat simple con historial en memoria
  const history = [];
  const chatBox = document.getElementById("chatBox");
  function push(role, content) {
    history.push({ role, content });
    const view = history.map(m => `${m.role === "user" ? "🧑 " : "🤖 "}${m.content}`).join("\n\n");
    chatBox.textContent = view;
  }

  document.getElementById("btnSend").addEventListener("click", async () => {
    const msgEl = document.getElementById("msg");
    const text = (msgEl.value || "").trim();
    if (!text) return;
    push("user", text);
    msgEl.value = "";

    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history })
    });

    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      push("assistant", "Error: " + (err.error || res.status));
      return;
    }
    const data = await res.json();
    push("assistant", data.reply || "(sin respuesta)");
  });
</script>
</html>
